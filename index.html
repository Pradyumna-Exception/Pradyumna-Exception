<script>
    let userNameSaved = "Friend";

    // Synthetic Pop Sound Generator (Works everywhere)
    function playPopSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {
            console.log(e);
        }
    }

    function showStep(fromId, toId) {
        document.getElementById(fromId).classList.add('hidden');
        document.getElementById(toId).classList.remove('hidden');
    }

    // Step 1: Lamp Switch
    document.getElementById('lampBtn').onclick = () => {
        document.body.style.backgroundColor = '#fff5c0';
        document.getElementById('lampIcon').style.filter = 'drop-shadow(0 0 30px #ffae19)';
        setTimeout(() => {
            document.body.style.backgroundColor = '#1a1805';
            showStep('step1', 'step2');
        }, 800);
    };

    // Step 2: Password Check
    document.getElementById('submitBtn').onclick = () => {
        const nameInput = document.getElementById('userName').value.trim();
        const rawDob = document.getElementById('userDOB').value.trim();
        const cleanDob = rawDob.replace(/[^0-9]/g, '');
        const errorTxt = document.getElementById('errorTxt');

        if (cleanDob === "19102005") {
            errorTxt.style.display = 'none';
            if(nameInput) userNameSaved = nameInput;
            showStep('step2', 'step3');
        } else {
            errorTxt.style.display = 'block';
        }
    };

    // Step 3: Balloon Pop
    document.getElementById('balloonBox').onclick = () => {
        playPopSound();
        if(window.confetti) confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        document.getElementById('balloonBox').style.display = 'none';
        document.getElementById('greetingName').innerText = `Happy Birthday 💖\n${userNameSaved}!`;
        document.getElementById('wishText').classList.remove('hidden');
    };

    // Step 4: Cake
    document.getElementById('toCakeBtn').onclick = () => showStep('step3', 'step4');

    document.getElementById('blowBtn').onclick = () => {
        document.getElementById('cakeEmoji').innerText = '🍰';
        if(window.confetti) confetti({ particleCount: 60 });
        setTimeout(() => {
            showStep('step4', 'step5');
            document.getElementById('treeMessage').innerText = `Happy Birthday ${userNameSaved}! ✨`;
            setTimeout(() => {
                document.getElementById('nextToMemoryBtn').classList.remove('hidden');
            }, 1800);
        }, 1000);
    };

    // Step 5 to Step 6
    document.getElementById('nextToMemoryBtn').onclick = () => {
        showStep('step5', 'step6');
    };
</script>
